name: wonderly
description: "Wonderly - a playful, offline-first learning app for kids in grades 1 to 5."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Navigation and dependency injection
  go_router: ^18.1.4
  get_it: ^9.3.0

  # Local persistence (the app is fully offline, no backend)
  shared_preferences: ^2.5.6

  # UI and platform services
  flutter_svg: ^2.5.0
  flutter_tts: ^4.2.5
  bloc_concurrency: ^0.3.0
  flutter_edge_ai: ^2.7.1
  genui: ^0.10.4
  flutter_edge_ai_litertlm: ^1.21.0
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.1
  battery_plus: ^7.1.2
  device_info_plus: ^13.3.0
  uuid: ^4.6.0
  package_info_plus: ^10.2.2
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  json_schema_builder: ^0.1.7

  # Natural reading voice (Kokoro). Pinned to 1.x: 2.0 removed the built in
  # text to phoneme step the voices need. See docs/adr/0008.
  sherpa_onnx: 1.13.8
  archive: ^4.7.1
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.2.16

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/audio/
    - assets/data/

  fonts:
    # Variable fonts (SIL OFL 1.1). Bundled so the app never touches the network.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

# Generated by `dart run flutter_launcher_icons` from assets/icon (see tool/render_icon_test.dart).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#F7BE4B"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  remove_alpha_ios: true

# Generated by `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#F7BE4B"
  image: assets/icon/icon_fg.png
  android_12:
    color: "#F7BE4B"
    image: assets/icon/icon_fg.png
  fullscreen: false
